<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Calculate and verify file hashes directly in your browser."
    >
    <title>File Hash Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="app-card">
            <h1>File Hash Checker</h1>
            <p class="subtitle">
                Calculate and verify file checksums directly in your browser.
            </p>

            <label for="fileInput">Select a file</label>

            <div class="file-row">
                <input type="file" id="fileInput">
                <button id="clearButton" class="secondary-button">
                    Clear
                </button>
            </div>

            <p id="fileInfo" class="file-info">
                No file selected.
            </p>

            <label for="algorithm">Hash algorithm</label>

            <select id="algorithm">
                <option value="SHA-256">SHA-256</option>
                <option value="SHA-384">SHA-384</option>
                <option value="SHA-512">SHA-512</option>
                <option value="SHA-1">SHA-1</option>
            </select>

            <button id="calculateButton" class="primary-button">
                Calculate Hash
            </button>

            <div class="field-group">
                <label for="calculatedHash">Calculated hash</label>

                <div class="hash-row">
                    <input
                        type="text"
                        id="calculatedHash"
                        readonly
                        placeholder="Your calculated hash will appear here"
                    >
                    <button id="copyButton" class="secondary-button" disabled>
                        Copy
                    </button>
                </div>
            </div>

            <div class="field-group">
                <label for="expectedHash">Expected hash</label>

                <input
                    type="text"
                    id="expectedHash"
                    placeholder="Paste the expected hash here"
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>

            <button id="verifyButton" class="secondary-button verify-button">
                Verify Hash
            </button>

            <div id="status" class="status" aria-live="polite">
                Select a file to begin.
            </div>

            <div class="privacy-note">
                Your file is processed locally in your browser and is not uploaded.
            </div>

            <footer>
                Created by <strong>Pulok-Akibuzzaman</strong><br>
                Built with assistance from <strong>GitHub Copilot</strong>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
